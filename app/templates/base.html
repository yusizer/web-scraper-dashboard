<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Web Scraper Dashboard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background:#f5f6f8; }
    .brand { font-weight:700; }
    .stat { font-size:1.6rem; font-weight:700; }
    .price { font-family:ui-monospace,monospace; color:#0d6efd; font-weight:600; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand bg-white border-bottom mb-4">
    <div class="container">
      <span class="navbar-brand brand"><i class="bi bi-globe2 text-primary me-1"></i>Web Scraper</span>
      <div class="ms-auto d-flex gap-2">
        <a class="btn btn-sm btn-outline-secondary" href="/">New scrape</a>
        <a class="btn btn-sm btn-outline-secondary" href="/history">History</a>
        <a class="btn btn-sm btn-outline-secondary" href="/docs">API</a>
      </div>
    </div>
  </nav>
  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
